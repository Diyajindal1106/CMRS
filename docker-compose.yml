version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cmrs_postgres
    restart: always
    environment:
      POSTGRES_DB: cmrs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmrs_backend
    restart: always
    environment:
      - SECRET_KEY=django-insecure-cmrs-docker-env-key-9988
      - DEBUG=True
      - DB_ENGINE=postgresql
      - POSTGRES_DB=cmrs_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python seed_data.py &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmrs_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
